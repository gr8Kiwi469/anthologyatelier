{{ define "base" }}

<html lang="{{ .Site.Language.Lang }}" class="no-js">

  <body class="{{ partial "common/body-classes.html" . }}">
    {{ partial "common/header.html" . }}

    <main id="main">
      {{ block "main" . }}{{ end }}

    {{ partial "footer.html" . }}

    {{ partial "common/scripts.html" . }}
  </body>
</html>
{{ end }}
