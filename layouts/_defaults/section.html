{{ define "main" }}
  <div class="prose dark:prose-invert max-w-none">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </div>

  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 mt-8">
    {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="block p-4 rounded-lg border border-neutral-700 hover:border-primary-500 hover:bg-neutral-800 transition">
        <h2 class="text-lg font-semibold">{{ .Title }}</h2>
        {{ with .Params.description }}
          <p class="text-sm text-neutral-400 mt-1">{{ . }}</p>
        {{ end }}
      </a>
    {{ end }}
  </div>
{{ end }}
